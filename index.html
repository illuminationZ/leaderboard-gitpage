<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Leaderboard GitPage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="js/app.js" defer></script>
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>


  <!-- Hand-drawn SVG icon set (no external assets, no license) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="grad-medal-1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe9a8"/>
        <stop offset="100%" stop-color="#d6a536"/>
      </linearGradient>
      <linearGradient id="grad-medal-2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#dce6f5"/>
        <stop offset="100%" stop-color="#8fa7c9"/>
      </linearGradient>
      <linearGradient id="grad-medal-3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e9b98a"/>
        <stop offset="100%" stop-color="#a2612f"/>
      </linearGradient>

      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" fill="currentColor"/>
      </symbol>

      <symbol id="icon-star" viewBox="0 0 24 24">
        <path d="M12 2 L14.7 8.6 L22 9.3 L16.5 14 L18.2 21 L12 17.3 L5.8 21 L7.5 14 L2 9.3 L9.3 8.6 Z" fill="currentColor"/>
      </symbol>

      <symbol id="icon-medal-1" viewBox="0 0 64 80">
        <polygon points="22,34 10,76 32,60" fill="#b5842a"/>
        <polygon points="42,34 54,76 32,60" fill="#8a611e"/>
        <circle cx="32" cy="28" r="24" fill="url(#grad-medal-1)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      </symbol>

      <symbol id="icon-medal-2" viewBox="0 0 64 80">
        <polygon points="22,34 10,76 32,60" fill="#5f7699"/>
        <polygon points="42,34 54,76 32,60" fill="#46586e"/>
        <circle cx="32" cy="28" r="24" fill="url(#grad-medal-2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      </symbol>

      <symbol id="icon-medal-3" viewBox="0 0 64 80">
        <polygon points="22,34 10,76 32,60" fill="#7a3f1c"/>
        <polygon points="42,34 54,76 32,60" fill="#5c2f15"/>
        <circle cx="32" cy="28" r="24" fill="url(#grad-medal-3)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      </symbol>

      <!-- Electric border filter, adapted from a Uiverse.io / reactbits "Electric Border" effect.
           Duplicated 3x (one per podium rank) so each card has its own noise seed. The feOffset
           dx/dy here are driven from JS (see electricBorderLoop in js/app.js) via a plain
           requestAnimationFrame loop instead of SMIL <animate>: SMIL-animated filters referenced
           from an HTML element via CSS `filter: url(#...)` get restarted by some browsers whenever
           the element repaints for an unrelated reason (hover elsewhere, layout, etc.), which read
           as a periodic stutter no amount of tuning the <animate> values could fix. Driving the
           offsets ourselves removes that failure mode entirely. -->
      <filter id="turbulent-displace-1" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="1" />
        <feOffset id="eb1-off1" in="noise1" dx="0" dy="0" result="offsetNoise1" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="1" />
        <feOffset id="eb1-off2" in="noise2" dx="0" dy="0" result="offsetNoise2" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="2" />
        <feOffset id="eb1-off3" in="noise1" dx="0" dy="0" result="offsetNoise3" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="2" />
        <feOffset id="eb1-off4" in="noise2" dx="0" dy="0" result="offsetNoise4" />
        <feComposite in="offsetNoise1" in2="offsetNoise2" result="part1" />
        <feComposite in="offsetNoise3" in2="offsetNoise4" result="part2" />
        <feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise" />
        <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="12" xChannelSelector="R" yChannelSelector="B" />
      </filter>

      <filter id="turbulent-displace-2" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="1" />
        <feOffset id="eb2-off1" in="noise1" dx="0" dy="0" result="offsetNoise1" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="1" />
        <feOffset id="eb2-off2" in="noise2" dx="0" dy="0" result="offsetNoise2" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="2" />
        <feOffset id="eb2-off3" in="noise1" dx="0" dy="0" result="offsetNoise3" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="2" />
        <feOffset id="eb2-off4" in="noise2" dx="0" dy="0" result="offsetNoise4" />
        <feComposite in="offsetNoise1" in2="offsetNoise2" result="part1" />
        <feComposite in="offsetNoise3" in2="offsetNoise4" result="part2" />
        <feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise" />
        <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="12" xChannelSelector="R" yChannelSelector="B" />
      </filter>

      <filter id="turbulent-displace-3" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="1" />
        <feOffset id="eb3-off1" in="noise1" dx="0" dy="0" result="offsetNoise1" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="1" />
        <feOffset id="eb3-off2" in="noise2" dx="0" dy="0" result="offsetNoise2" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise1" seed="2" />
        <feOffset id="eb3-off3" in="noise1" dx="0" dy="0" result="offsetNoise3" />
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" result="noise2" seed="2" />
        <feOffset id="eb3-off4" in="noise2" dx="0" dy="0" result="offsetNoise4" />
        <feComposite in="offsetNoise1" in2="offsetNoise2" result="part1" />
        <feComposite in="offsetNoise3" in2="offsetNoise4" result="part2" />
        <feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise" />
        <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="12" xChannelSelector="R" yChannelSelector="B" />
      </filter>

      <!-- UI icon set -->
      <symbol id="icon-crown" viewBox="0 0 24 24"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8zm2 12h14v2H5v-2z" fill="currentColor"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.9 12.1l5 5 1.4-1.4-5-5A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M12 3 3 10h2v9h6v-6h2v6h6v-9h2z" fill="currentColor"/></symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4zM5 4H3a3 3 0 0 0 3 5M19 4h2a3 3 0 0 1-3 5M9 20h6v-2H9zM11 12h2v6h-2z" fill="currentColor"/></symbol>
      <symbol id="icon-swords" viewBox="0 0 24 24"><g fill="currentColor"><path d="M4 20l9-9 2 2-9 9-2-1z"/><path d="M20 4l-9 9-2-2 9-9 2 1z"/><rect x="10.5" y="10.5" width="3" height="3" transform="rotate(45 12 12)"/></g></symbol>
      <symbol id="icon-gift" viewBox="0 0 24 24"><path d="M4 8h16v3H4zM5 11h14v9H5zM12 3c-2 0-3 2-3 3.5S10.5 8 12 8s3-.7 3-1.5S14 3 12 3z" fill="currentColor"/></symbol>
      <symbol id="icon-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5" fill="currentColor"/><path d="M9 13l-3 8 6-3 6 3-3-8z" fill="currentColor"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6z" fill="currentColor"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="currentColor"/></symbol>
      <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5" fill="currentColor"/><path d="M2 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5z" fill="currentColor"/><circle cx="17" cy="9" r="3" fill="currentColor"/><path d="M15 14.2c2.6.4 4.5 2.2 5 5.8h-4" fill="currentColor"/></symbol>
      <symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="currentColor"/></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M14 5l-7 7 7 7 1.4-1.4L9.8 12l5.6-5.6z" fill="currentColor"/></symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M10 5l7 7-7 7-1.4-1.4L14.2 12 8.6 6.4z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div class="app-shell">
  

    <div class="main">
      <header class="topbar">
        <h1 class="title">
          <dotlottie-wc class="title-crown" src="https://lottie.host/ec32f99c-d684-4736-9638-29968c1f467e/hYsqLvHEYg.lottie" autoplay loop aria-hidden="true"></dotlottie-wc>
          LEADERBOARD
        </h1>

      </header>


      <main id="content">
        <div class="podium-stage">
          <dotlottie-wc class="podium-lottie" src="https://lottie.host/bb9e6097-e576-40e6-acd6-c3d261440879/msaPWeN8tb.lottie" autoplay loop aria-hidden="true"></dotlottie-wc>
          <section class="podium" id="podium"></section>
        </div>

        <section class="leaderboard" id="leaderboard">
          <table class="entries-table" id="entries"></table>
          <nav class="pagination" id="pagination" aria-label="Leaderboard pages"></nav>
        </section>
      </main>

      <footer>
        <p>Built with GitHub Pages &amp; JavaScript</p>
      </footer>
    </div>
  </div>
</body>
</html>
